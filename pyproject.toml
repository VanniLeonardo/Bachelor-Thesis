[project]
name = "vggt-uncertainty"
version = "1.0.0"
description = "VGGT with a probabilistic camera head: full 6x6 pose covariances in a single feed-forward pass"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">= 3.10"
authors = [
    { name = "Leonardo Vanni", email = "info@leonardovanni.com" },
]
maintainers = [
    { name = "Leonardo Vanni", email = "info@leonardovanni.com" },
]
keywords = ["3D reconstruction", "camera pose", "uncertainty quantification", "VGGT", "SE(3)"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch / torchvision are deliberately not pinned here to avoid CUDA mismatches;
# install them first (see docs/package.md), e.g. torch==2.3.1 torchvision==0.18.1.
dependencies = [
    "numpy<2",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "opencv-python",
]

[project.urls]
Repository = "https://github.com/VanniLeonardo/Bachelor-Thesis"
Upstream = "https://github.com/facebookresearch/vggt"

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
    "pydantic==2.10.6",
]
train = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fvcore",
    "iopath",
    "tensorboard",
    "opencv-python",
    "wcmatch",
    "scipy",
    "matplotlib",
]
test = [
    "pytest",
    "scipy",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"
# Only the files added or rewritten by the uncertainty extension are linted; the
# upstream VGGT sources are left as they were released.
include = [
    "vggt/utils/uncertainty.py",
    "vggt/utils/checkpoint.py",
    "vggt/heads/camera_head.py",
    "training/loss.py",
    "training/launch.py",
    "plot_calibration.py",
    "demo_viser.py",
    "scripts/*.py",
    "tests/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

# Pixi configuration (inherited from upstream)
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vggt-uncertainty = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }

[tool.pixi.tasks]
