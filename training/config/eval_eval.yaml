# Validation-only run of a trained head on the evaluation half of the CO3D test split (every reported number).
#     torchrun --nproc_per_node=1 launch.py --config eval_eval checkpoint.resume_checkpoint_path=logs/v1.0.0/ckpts/checkpoint.pt
# Writes logs/eval_eval/calibration_epoch_0.npz (per-frame d^2, log-det and pose errors).
defaults:
  - default
  - _self_

mode: val
exp_name: eval_eval
limit_val_batches: 1000

data:
  val:
    dataset:
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: test
          sequences_file: splits/co3d_test_eval.txt
          CO3D_DIR: ${oc.env:CO3D_DIR,/data/CO3D}
          CO3D_ANNOTATION_DIR: ${oc.env:CO3D_ANNOTATION_DIR,/data/CO3D_ann}
