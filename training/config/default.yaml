defaults:
  - default_dataset.yaml
  - _self_

exp_name: v1.0.0
img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 2    # gradient accumulation steps (halves the per-step memory); set to 1 if memory allows
patch_size: 14
val_epoch_freq: 5
max_img_per_gpu: 24

limit_train_batches: 500
limit_val_batches: 1000


data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True
      repeat_batch: True   # training-time augmentation: append a frame-reversed copy of each batch
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: train
          CO3D_DIR: ${oc.env:CO3D_DIR,/data/CO3D}
          CO3D_ANNOTATION_DIR: ${oc.env:CO3D_ANNOTATION_DIR,/data/CO3D_ann}
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: test
          CO3D_DIR: ${oc.env:CO3D_DIR,/data/CO3D}
          CO3D_ANNOTATION_DIR: ${oc.env:CO3D_ANNOTATION_DIR,/data/CO3D_ann}


logging:
  log_dir: logs/${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - objective
        - loss_nll_base
        - loss_uncertainty_scale
        - loss_uncertainty_balance
        - loss_condition_number
        - mahalanobis_mean
        - log_det_mean
        - sigma_trans_mean
        - sigma_rot_mean_deg
        - twist_trans_err_mean
        - twist_rot_err_mean_deg
        - curriculum_nll_weight
        - curriculum_regularizer_factor
    val:
      keys_to_log:
        - objective
        - loss_nll_base
        - loss_uncertainty_scale
        - loss_uncertainty_balance
        - loss_condition_number
        - mahalanobis_mean
        - log_det_mean
        - sigma_trans_mean
        - sigma_rot_mean_deg
        - twist_trans_err_mean
        - twist_rot_err_mean_deg


checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 2
  # Pre-trained VGGT-1B weights (https://huggingface.co/facebook/VGGT-1B/resolve/main/model.pt)
  resume_checkpoint_path: ${oc.env:VGGT_PRETRAINED_CKPT,model.pt}
  strict: False


loss:
  _target_: loss.MultitaskLoss
  # Curriculum (thesis §3.7.1): warm-up on the regularizers only, then NLL with the
  # regularizer weights annealed linearly to zero at max_epochs.
  warmup_epochs: 1
  anneal_regularizers: True
  # Post-hoc temperature scaling, applied in the validation phase only (never in training).
  eval_temperature: 1.0
  pose_uncertainty:
    kappa: 10.0                        # weight of the rotational twist components (thesis §2.5.5)
    error_convention: body             # T_err = E_pred inv(E_gt): covariance in the predicted camera's frame
    shield_eps: 1.0e-4                 # Sigma = L L^T + eps I, used for BOTH NLL terms
    log_diag_min: -7.0                 # clamp on the predicted log-std-devs
    log_diag_max: 3.0
    exclude_reference_frame: True      # camera 0 is the identity for prediction and GT: no information
    scale_regularization: 1.0          # lambda_scale (Algorithm 3)
    condition_number_regularization: 1.0   # lambda_cond
    balance_regularization: 1.0        # lambda_bal (Algorithm 5)
    uncertainty_scale_target: 0.05     # r: target sigma_trans <= r (normalized scene units, scene scale = 1)
    condition_number_tolerance: 20.0   # tau_cond
    balance_log_ratio_threshold: 1.6094379   # log(5)


optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05

  # Everything except the covariance branch is frozen explicitly in Trainer.__init__;
  # these patterns additionally put the frozen modules in eval mode.
  frozen_module_names:
      - "*aggregator*"
      - "*camera_head.trunk*"
      - "*camera_head.mean_pose_branch*"
      - "*camera_head.token_norm*"
      - "*camera_head.trunk_norm*"
      - "*camera_head.embed_pose*"
      - "*camera_head.poseLN_modulation*"
      - "*camera_head.adaln_norm*"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["camera_head.covariance_branch"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05


max_epochs: 20

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: False
  enable_point: False
  enable_track: False


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: False  # True for Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
